services:
  portfolio:
    container_name: my-portfolio-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8098:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
